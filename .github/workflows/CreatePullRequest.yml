name: Create Pull Request on Push

on:
  push:
    branches:
      - main  # 監視するブランチを指定

jobs:
  create_pull_request:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Check commit message
      id: check_commit_message
      run: |
        if [[ "$(git log -1 --pretty=%B)" != *"[プルリクエスト]"* ]]; then
          echo "Commit message does not contain '[プルリクエスト]'."
          exit 0
        fi

    - name: Create Pull Request
      if: steps.check_commit_message.outcome == 'success'
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "Automatically generated pull request"
        branch: "auto-pr-branch"  # プルリクエストの作成に使用するブランチ名
        title: "Automated Pull Request"
        body: |
          This pull request was automatically created because the commit message contained '[プルリク]'.
        base: "develop"  # プルリクエストを作成する対象ブランチ
