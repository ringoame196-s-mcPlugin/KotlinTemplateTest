name: Create Pull Request on Push

on:
  push:
    branches:
      - main  # 監視するブランチを指定

jobs:
  create_pull_request:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "Automatically generated pull request"
        branch: "auto-pr-branch"  # プルリクエストの作成に使用するブランチ名
        title: "Automated Pull Request"
        body: |
          This pull request was automatically created by a push to the `main` branch.
        base: "development"  # プルリクエストを作成する対象ブランチ
        labels: ["autogenerated"]  # プルリクエストに追加するラベル
